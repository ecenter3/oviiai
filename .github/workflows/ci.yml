name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  adapters:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: adapters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: ruff check --output-format=github .
      - run: pytest -q

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: timescale/timescaledb:2.28.3-pg16
        env:
          POSTGRES_USER: rms
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: rms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rms -d rms"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rms:ci@localhost:5432/rms
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      # migration 必須可重複執行：up → 全部 down → 再 up
      - run: npm run migrate
      - run: npm run migrate:down -- 0
      - run: npm run migrate
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
