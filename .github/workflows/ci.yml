name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  adapters:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: adapters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: ruff check --output-format=github .
      - run: pytest -q

  contracts:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      # T-07：與 adapters 的 pytest 讀同一份 fixtures/messages.json
      - run: npm test

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: timescale/timescaledb:2.28.3-pg16
        env:
          POSTGRES_USER: rms
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: rms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rms -d rms"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
      emqx:
        image: emqx/emqx:5.8.3
        ports: ["1883:1883"]
        # 與 infra/docker-compose.dev.yml 相同的認證與權限設定（金鑰 = 下方 EMQX_JWT_SECRET）
        env:
          EMQX_AUTHENTICATION: '[{mechanism = jwt, from = password, use_jwks = false, algorithm = "hmac-based", secret = "ci-only-emqx-jwt-secret-ci-only-0001", secret_base64_encoded = false, acl_claim_name = acl, disconnect_after_expire = false, verify_claims = {username = "${username}"}}]'
          EMQX_AUTHORIZATION__NO_MATCH: deny
          EMQX_AUTHORIZATION__SOURCES: '[]'
        options: >-
          --health-cmd "emqx ctl status"
          --health-interval 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://rms:ci@localhost:5432/rms
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only
      DATA_ENC_KEY: ci-only-data-key-ci-only-data-key-ci-only
      ADAPTER_KEY_MOCK: ci-only-adapter-key-0001
      ADAPTER_ALLOWED_CIDRS: 127.0.0.1/32,::1/128
      REDIS_URL: redis://localhost:6379
      MQTT_URL: mqtt://localhost:1883
      EMQX_JWT_SECRET: ci-only-emqx-jwt-secret-ci-only-0001
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 後端引用 packages/contracts 的編譯結果
      - run: npm install && npm run build
        working-directory: packages/contracts
      - run: npm install
      - run: npm run lint
      # migration 必須可重複執行：up → 全部 down → 再 up
      - run: npm run migrate
      - run: npm run migrate:down -- 0
      - run: npm run migrate
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 前端以 alias 直接引用 contracts 原始碼，需要它的相依（zod）
      - run: npm install
        working-directory: packages/contracts
      - run: npm install
      - run: npm test
      - run: npm run build
