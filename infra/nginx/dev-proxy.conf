# 開發用：nginx 服務 frontend/dist 並代理 /api、/ws 到開發機的後端（繞過 Windows Chrome 經 Vite 代理收大回應卡住的問題，見 docs/setup-windows.md）
server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://host.docker.internal:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /ws/ { proxy_pass http://host.docker.internal:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location / { try_files $uri /index.html; }
}
