# 開發用：16 GB 筆電，各服務都設了記憶體上限
# 啟動：make up（不含 MediaMTX）／make up-media（含 MediaMTX）
name: oviiai-dev

services:
  db:
    image: timescale/timescaledb:2.28.3-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    # log_parameter_max_length*=0：查詢參數不寫進 PostgreSQL 日誌（pgp_sym_encrypt 的明文與金鑰是參數；PR #10 審查第 2 點）
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=100",
              "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    mem_limit: 384m

  emqx:
    image: emqx/emqx:5.8.3
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      # 帳號與權限（安全收尾 e）：JWT 認證，金鑰與後端共用；權限在 JWT 的 acl，沒列到的主題一律拒絕。
      # 後端自己簽（帳號 backend），轉接器的由後端 GET /adapter-config/{name} 核發（帳號＝轉接器名稱，只含自己的機器人）。
      # $${username}：compose 跳脫，EMQX 收到 ${username}（JWT 只能用在簽給的那個帳號）
      EMQX_AUTHENTICATION: >-
        [{mechanism = jwt, from = password, use_jwks = false, algorithm = "hmac-based",
        secret = "${EMQX_JWT_SECRET:?請在 .env 設定 EMQX_JWT_SECRET（openssl rand -hex 32）}", secret_base64_encoded = false,
        acl_claim_name = acl, disconnect_after_expire = false, verify_claims = {username = "$${username}"}}]
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__SOURCES: "[]"
    ports:
      - "1883:1883"     # MQTT
      - "8883:8883"     # MQTT TLS（正式環境用）
      - "18083:18083"   # 管理介面
    volumes: [emqx-data:/opt/emqx/data]
    mem_limit: 768m

  # 物件儲存（S3 相容）：照片、錄影、平面圖。
  # MinIO 社群版已於 2025-10 停止發布映像檔，改用 SeaweedFS（Apache 2.0）。
  s3:
    image: chrislusf/seaweedfs:4.44
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # Filer 網頁（瀏覽檔案）
    volumes: [s3-data:/data]
    mem_limit: 512m

  mediamtx:
    # -ffmpeg 版：開發時沒有攝影機，用 ffmpeg 測試影像源（testsrc）模擬（後端 MEDIA_TEST_SOURCE）
    image: bluenviron/mediamtx:1.19.3-ffmpeg
    profiles: ["media"]
    restart: unless-stopped
    ports:
      - "8554:8554"       # RTSP（後端抓拍、錄影讀這裡）
      - "8889:8889"       # WebRTC (WHEP)
      - "8189:8189"       # WebRTC ICE（TCP）
      - "9997:9997"       # Control API
    extra_hosts: ["host.docker.internal:host-gateway"]   # 回呼開發機上的後端
    volumes: [./mediamtx.yml:/mediamtx.yml:ro]
    mem_limit: 512m

configs:
  s3_identities:
    content: |
      {"identities": [{"name": "rms",
        "credentials": [{"accessKey": "${S3_ACCESS_KEY:-rms}", "secretKey": "${S3_SECRET_KEY:-change-me-too}"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}

volumes:
  db-data:
  redis-data:
  emqx-data:
  s3-data:
